@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.num{fill:#60a5fa;font-size:10px;letter-spacing:1.4px}
.name{fill:#ececf0;font-size:14px;font-weight:600}
.meta{fill:#858593;font-size:10px;letter-spacing:1px}
.iconbox{fill:#172554;stroke:#1d4ed8}
.icon{fill:none;stroke:#93c5fd;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.p{opacity:1}}
</style>
