<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Selected projects: TowingTask front, Nafis Leather, CSeven, OKR and FasihiExchangeFront">
<style>
