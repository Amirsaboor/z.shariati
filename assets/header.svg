<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Zahra Shariati — Backend Developer and Project Manager">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D18"/><stop offset="1" stop-color="#111E33"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15243A"/><stop offset="1" stop-color="#0D1728"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1" fill="#94A3B8" opacity=".18"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<style>
  text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}.sans{font-family:'Segoe UI',Arial,sans-serif}
  .rise{opacity:0;animation:rise .7s ease-out forwards}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .float{animation:float 5s ease-in-out infinite;transform-origin:center}@keyframes float{50%{transform:translateY(-5px)}}
  .dash{stroke-dasharray:5 7;animation:dash 18s linear infinite}@keyframes dash{to{stroke-dashoffset:-120}}
  .blink{animation:blink 1.1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}.rise{opacity:1}}
</style>
<rect width="1000" height="300" rx="20" fill="url(#bg)"/>
<rect x="1" y="1" width="998" height="298" rx="19" fill="url(#dots)" stroke="#1E2B40"/>
<path d="M0 20Q0 0 20 0H14V300H20Q0 300 0 280Z" fill="url(#accent)"/>
<circle cx="820" cy="145" r="125" fill="#2563EB" opacity=".12" filter="url(#glow)"/>
<path d="M550 24V276" stroke="#263750" stroke-width="1"/>
<g class="rise" style="animation-delay:.08s">
  <text x="62" y="58" font-size="12" fill="#60A5FA" letter-spacing="2">PROFILE / 001</text>
  <path d="M62 76H105" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
</g>
<g class="rise sans" style="animation-delay:.2s">
  <text x="58" y="139" font-size="55" font-weight="700" letter-spacing="-2" fill="#F1F5F9">Zahra</text>
  <text x="58" y="196" font-size="55" font-weight="700" letter-spacing="-2" fill="#60A5FA">Shariati</text>
</g>
<g class="rise" style="animation-delay:.36s">
  <text x="62" y="231" font-size="15" font-weight="600" fill="#E2E8F0">Backend Developer <tspan fill="#3B82F6">/</tspan> Project Manager</text>
  <text x="62" y="258" font-size="12" fill="#94A3B8">PHP  ·  Laravel  ·  MySQL  ·  Delivery</text>
  <rect x="405" y="247" width="7" height="13" rx="1" fill="#60A5FA" class="blink"/>
</g>
<g class="float">
  <rect x="596" y="43" width="340" height="211" rx="14" fill="url(#panel)" stroke="#29405F"/>
  <path d="M596 81H936" stroke="#29405F"/>
  <circle cx="617" cy="62" r="4" fill="#60A5FA"/><circle cx="632" cy="62" r="4" fill="#3B82F6" opacity=".6"/><circle cx="647" cy="62" r="4" fill="#94A3B8" opacity=".45"/>
  <text x="671" y="66" font-size="10" fill="#94A3B8">WORKSPACE / OVERVIEW</text>
  <rect x="615" y="98" width="137" height="132" rx="8" fill="#0B1423" stroke="#243751"/>
  <text x="630" y="119" font-size="10" fill="#60A5FA">API / ROUTES</text>
  <text x="630" y="145" font-size="11" fill="#CBD5E1">GET  /projects</text>
  <text x="630" y="169" font-size="11" fill="#CBD5E1">POST /tasks</text>
  <text x="630" y="193" font-size="11" fill="#CBD5E1">AUTH / secure</text>
  <path d="M630 207H710" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <rect x="768" y="98" width="149" height="58" rx="8" fill="#12243A" stroke="#29405F"/>
  <text x="782" y="117" font-size="9" fill="#94A3B8">SPRINT PROGRESS</text>
  <text x="782" y="142" font-size="19" font-weight="700" fill="#F1F5F9">78<tspan font-size="10" fill="#60A5FA">%</tspan></text>
  <rect x="838" y="135" width="62" height="4" rx="2" fill="#263750"/>
  <rect x="838" y="135" width="48" height="4" rx="2" fill="url(#accent)"/>
  <rect x="768" y="168" width="149" height="62" rx="8" fill="#12243A" stroke="#29405F"/>
  <text x="782" y="187" font-size="9" fill="#94A3B8">TASK BOARD</text>
  <rect x="782" y="198" width="35" height="19" rx="4" fill="#1D3A5C"/><rect x="823" y="198" width="35" height="19" rx="4" fill="#1D3A5C"/><rect x="864" y="198" width="39" height="19" rx="4" fill="#1D3A5C"/>
  <circle cx="790" cy="207" r="3" fill="#60A5FA"/><circle cx="831" cy="207" r="3" fill="#60A5FA"/><circle cx="872" cy="207" r="3" fill="#60A5FA"/>
  <path d="M574 110C585 110 585 110 596 110M574 202C585 202 585 202 596 202" fill="none" stroke="#60A5FA" stroke-opacity=".65" class="dash"/>
</g>
<text x="920" y="278" text-anchor="end" font-size="9" fill="#64748B" letter-spacing="1.5">BUILD  ·  ORGANIZE  ·  DELIVER</text>
</svg>